<title>Amor Fati — Journal & Streaks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23221c14'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%23f6f3ec'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
:root{--r:14px;--serif:Georgia,'Iowan Old Style','Times New Roman',serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html[data-theme=white]{--bg:#f6f3ec;--bg2:#efe9dd;--sf:#fffdf7;--tx:#221c14;--mu:#877d6e;--ln:#e3dbca;--ac:#221c14;--at:#f6f3ec;--dg:#c93a32;color-scheme:light}
html[data-theme=black]{--bg:#0f0e0c;--bg2:#161411;--sf:#1b1916;--tx:#ece6d9;--mu:#968d7b;--ln:#2c2820;--ac:#ece6d9;--at:#161411;--dg:#ff6b61;color-scheme:dark}
html[data-theme=red]{--bg:#170b0a;--bg2:#1e100e;--sf:#231412;--tx:#f7e9e4;--mu:#b3938a;--ln:#3c231e;--ac:#ff5d55;--at:#2a0b08;--dg:#ff8d86;color-scheme:dark}
html[data-theme=blue]{--bg:#0a111c;--bg2:#0e1624;--sf:#141e2f;--tx:#e8eef8;--mu:#8fa2bd;--ln:#243450;--ac:#5aa7ff;--at:#071324;--dg:#ff7b72;color-scheme:dark}
html[data-theme=green]{--bg:#0b130d;--bg2:#0f1a12;--sf:#152118;--tx:#e7f1e7;--mu:#8fa893;--ln:#26382b;--ac:#4cd07d;--at:#07170c;--dg:#ff7b72;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.55 var(--sans);min-height:100dvh}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:200px;resize:vertical;line-height:1.7}
#wall{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .6s}
#wall.on{opacity:1}
#wall .l{position:absolute;inset:0;background-size:cover;background-position:center top;opacity:0;transition:opacity 2s ease}
#wall .l.on{opacity:1}
#wall::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:.76}
html[data-theme=white] #wall::after{opacity:.86}
.epi{margin:10px 0 0;padding-left:12px;border-left:2px solid var(--ac);font:italic 14px/1.5 var(--serif);color:var(--mu)}
.mu{color:var(--mu)}.sm{font-size:12.5px}.mt{margin-top:14px}
main{max-width:760px;margin:0 auto;padding:16px 14px 120px}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border-radius:12px;font-size:11px;color:var(--mu);min-width:62px}
#tabs a.on{color:var(--tx);background:var(--bg2)}
#tabs b{font-size:18px;font-weight:400}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ac);color:var(--at);border-radius:11px;padding:10px 18px;font-weight:600;font-size:14px}
.btn.g{background:none;color:var(--tx);border:1px solid var(--ln)}.btn.d{background:none;color:var(--dg);border:1px solid var(--dg)}.btn.s{padding:6px 12px;font-size:13px}
.chip{padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--ln);background:var(--bg2)}
.bar{height:8px;border-radius:99px;background:var(--bg2);border:1px solid var(--ln);overflow:hidden}.bar i{display:block;height:100%}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:10px 14px}.stat b{font:600 22px var(--serif);display:block}
.sc{border-left:5px solid var(--c);cursor:pointer}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.day{aspect-ratio:1;border-radius:9px;border:1px solid var(--ln);background:var(--bg2);font-size:11px;color:var(--mu)}
.day.c{background:var(--c);border-color:var(--c);color:#fff}.day.p{border:1.5px dashed var(--c);color:var(--tx)}
.day.m{color:var(--dg);text-decoration:line-through}.day.f{opacity:.5}.day.t{outline:2px solid var(--ac);outline-offset:1px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px}
.cell.h{background:var(--sf);border:1px solid var(--ln)}.cell.t{outline:2px solid var(--ac)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.ent{display:flex;gap:12px;cursor:pointer;margin-top:12px}
.dc{flex:none;width:46px;text-align:center;background:var(--bg2);border:1px solid var(--ln);border-radius:10px;padding:5px 0;font-family:var(--serif)}.dc b{display:block;font-size:18px}.dc span{font-size:10px;color:var(--mu);text-transform:uppercase}
.th{display:flex;gap:4px;margin-top:6px}.th img{width:34px;height:34px;object-fit:cover;border-radius:7px}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ph figure{margin:0;position:relative}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.ph .x{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:#000a;color:#fff;font-size:12px}
.ph input{margin-top:4px;font-size:12px;padding:5px 8px}
.add{border:1.5px dashed var(--ln);border-radius:10px;color:var(--mu);min-height:110px;width:100%}
.pk{padding:7px 13px;border-radius:99px;border:1.5px solid var(--ln);font-size:13px;color:var(--mu)}.pk.on{border-color:var(--c);color:var(--tx);background:color-mix(in srgb,var(--c) 15%,transparent)}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px var(--ln)}.sw.on{border-color:var(--tx)}
.prose{font-size:16px;line-height:1.75}.prose .tg{color:var(--ac);font-weight:600}
.fig img{width:100%;border-radius:12px;display:block;margin-top:12px}.fig figcaption{font-size:13px;color:var(--mu);font-style:italic;text-align:center}
#modal{position:fixed;inset:0;z-index:60;background:#0008;padding:6vh 12px;overflow:auto}
#modal .m{max-width:500px;margin:0 auto;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#toast div{background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13.5px;font-weight:600}
.ban{border:1px solid var(--ln);border-left:4px solid var(--ac);background:var(--sf);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:12px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.set:last-child{border:0}
.home{min-height:64vh;display:flex;flex-direction:column;justify-content:center;gap:28px}
.home .epi{font-size:23px;line-height:1.55;border:0;padding:0;color:var(--tx)}
.home .btn{align-self:flex-start}
#lock[hidden]{display:none}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#lock .pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px}
#lock .pad button{width:64px;height:64px;border-radius:50%;background:var(--sf);border:1px solid var(--ln);font:20px var(--serif)}
#lock .dots{display:flex;gap:10px}#lock .dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mu)}#lock .dots i.f{background:var(--ac);border-color:var(--ac)}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0"),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const ds=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,today=()=>ds(new Date());
const fd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const add=(s,n)=>{const d=fd(s);d.setDate(d.getDate()+n);return ds(d)};
const MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fl=s=>{const d=fd(s);return d.toLocaleDateString(undefined,{weekday:"long"})+", "+MO[d.getMonth()]+" "+d.getDate()+", "+d.getFullYear()};
const fs=s=>{const d=fd(s);return MO[d.getMonth()].slice(0,3)+" "+d.getDate()+", "+d.getFullYear()};

/* ---- storage (IndexedDB, on this device only) ---- */
const DB={db:null,
 open(){return new Promise((ok,no)=>{const r=indexedDB.open("amorfati",2);
  r.onupgradeneeded=e=>{const d=e.target.result;["entries","streaks"].forEach(n=>d.objectStoreNames.contains(n)||d.createObjectStore(n,{keyPath:"id"}));d.objectStoreNames.contains("meta")||d.createObjectStore("meta",{keyPath:"key"})};
  r.onsuccess=()=>{DB.db=r.result;ok()};r.onerror=()=>no(r.error)})},
 tx(n,f){return new Promise((ok,no)=>{const t=DB.db.transaction(n,"readwrite"),q=f(t.objectStore(n));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})},
 all(n){return DB.tx(n,s=>s.getAll())},put(n,v){return DB.tx(n,s=>s.put(v))},del(n,id){return DB.tx(n,s=>s.delete(id))},clear(n){return DB.tx(n,s=>s.clear())}};
const S={entries:[],streaks:[],set:{theme:null,lastBackup:null}};
let ED=null,calM=new Date(new Date().getFullYear(),new Date().getMonth(),1),q="";
async function load(){S.entries=await DB.all("entries");S.streaks=(await DB.all("streaks")).sort((a,b)=>a.createdAt-b.createdAt);
 const m=(await DB.all("meta")).find(x=>x.key==="settings");S.set={theme:null,lastBackup:null,...(m?m.value:{})}}
const saveSet=()=>DB.put("meta",{key:"settings",value:S.set});
const eById=id=>S.entries.find(e=>e.id===id),sById=id=>S.streaks.find(s=>s.id===id);
function theme(){document.documentElement.dataset.theme=S.set.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"black":"white");
 document.querySelector("meta[name=theme-color]").content=TH[document.documentElement.dataset.theme]}
function toast(m,ms=2600){const d=document.createElement("div");d.textContent=m;$("#toast").appendChild(d);setTimeout(()=>d.remove(),ms)}
function modal(h){const m=$("#modal");m.innerHTML=`<div class="m">${h}</div>`;m.hidden=false}
const closeM=()=>{$("#modal").hidden=true;$("#modal").innerHTML=""};

/* ---- streak logic: always derived from saved entries ---- */
function dstat(s,d){const L=S.entries.filter(e=>e.date===d&&(e.streakIds||[]).includes(s.id));
 const w=L.some(e=>(e.title||"").trim()||(e.body||"").trim()),p=L.some(e=>e.photos.length);
 return w&&p?"c":w||p?"p":""}
function stats(s){const t=today(),days=[];for(let i=0;i<s.duration;i++)days.push(add(s.start,i));
 let done=0,miss=0;days.forEach(d=>{const x=dstat(s,d);if(x==="c")done++;else if(d<t&&x!=="p")miss++});
 let d=dstat(s,t)==="c"?t:add(t,-1),run=0;while(d>=s.start&&dstat(s,d)==="c"){run++;d=add(d,-1)}
 const last=days[days.length-1];
 return{days,done,miss,run,last,pct:Math.round(done/s.duration*100),left:s.duration-done,
  due:s.status==="active"&&t>=s.start&&t<=last&&dstat(s,t)!=="c"}}
async function autoDone(){for(const s of S.streaks)if(s.status==="active"&&stats(s).done>=s.duration){s.status="done";await DB.put("streaks",s);toast("🎉 “"+s.name+"” complete!")}}

/* ---- tiny markdown ---- */
function md(t){let s=esc(t||"").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/(^|\s)#([\w-]+)/g,'$1<span class="tg">#$2</span>');
 return s.split(/\n{2,}/).map(b=>"<p>"+b.replace(/\n/g,"<br>")+"</p>").join("")}
const exc=e=>{const t=(e.body||"").replace(/[#*]/g," ").replace(/\s+/g," ").trim();return t.length>140?t.slice(0,140)+"…":t};

function view(h,after){$("#app").innerHTML=h;const c=route()[0];
 const on={entry:"diary",edit:"diary",streak:"streaks"}[c]||c;
 $("#tabs").innerHTML=TABS.map(([i,l,g])=>`<a href="#/${i}" class="${on===i?"on":""}"><b>${g}</b>${l}</a>`).join("");
 $("#tl").textContent=fs(today());wall(c==='home'?'home':c);after&&after();scrollTo(0,0)}
function render(){const r=route();({diary:vDiary,entry:()=>vEntry(r[1]),edit:()=>vEdit(r[1],r[2],r[3]),streaks:vStreaks,streak:()=>vStreak(r[1]),cal:vCal,settings:vSet}[r[0]]||vHome)()}
addEventListener("hashchange",render);
let wt=null,wi=0,wp=null,wl=0;
function wall(page){const el=$("#wall"),L=WALLS[page];clearInterval(wt);
 if(!L){el.classList.remove("on");wp=null;return}
 if(wp===page){el.classList.add("on");return}
 wp=page;wi=0;wl=0;const ls=el.querySelectorAll(".l");ls[0].style.backgroundImage=`url("${L[0]}")`;ls[0].classList.add("on");ls[1].classList.remove("on");el.classList.add("on");
 if(L.length>1)wt=setInterval(()=>{let n;do{n=Math.floor(Math.random()*L.length)}while(n===wi);wi=n;wl=1-wl;const a=ls[wl],b=ls[1-wl];a.style.backgroundImage=`url("${L[wi]}")`;a.classList.add("on");b.classList.remove("on")},30000)}

/* ---- views ---- */
function sCard(s){const x=stats(s),c=COL[s.color];
 return `<div class="card sc" style="--c:${c}" data-a="streak" data-id="${s.id}"><div class="sp"><b>${esc(s.name)}</b><span class="chip" style="color:${c};border-color:${c}">${x.pct}%</span></div>
 <div class="bar mt"><i style="width:${x.pct}%;background:${c}"></i></div>
 <div class="sm mu mt">${x.done} of ${s.duration} days · ${x.left} left · ${FLAME} ${x.run} run${s.status!=="active"?" · "+s.status:""}<br>Ends ${fs(x.last)}${x.due?` · <b style="color:${c}">due today</b>`:""}</div></div>`}
function eItem(e){const d=fd(e.date),dots=(e.streakIds||[]).map(sById).filter(Boolean).map(s=>`<span class="dot" style="background:${COL[s.color]}"></span>`).join(" ");
 return `<div class="card ent" data-a="entry" data-id="${e.id}"><div class="dc"><b>${d.getDate()}</b><span>${MO[d.getMonth()].slice(0,3)}</span></div>
 <div style="flex:1;min-width:0"><div class="sp"><b>${esc(e.title)||'<span class="mu">Untitled</span>'}</b><span class="sm mu">${e.photos.length?"📷 "+e.photos.length:""} ${dots}</span></div>
 <div class="mu sm">${esc(exc(e))||"<i>Photos only</i>"}</div>
 ${e.photos.length?`<div class="th">${e.photos.slice(0,5).map(p=>`<img src="${p.src}" alt="">`).join("")}</div>`:""}</div></div>`}

const QUOTES=[["Do nothing which is of no use.", "Miyamoto Musashi"], ["Today is victory over yourself of yesterday.", "Miyamoto Musashi"], ["Perceive that which cannot be seen with the eye.", "Miyamoto Musashi"], ["Think lightly of yourself and deeply of the world.", "Miyamoto Musashi"], ["The Way is in training.", "Miyamoto Musashi"], ["What stands in the way becomes the way.", "Marcus Aurelius"], ["Waste no more time arguing what a good man should be. Be one.", "Marcus Aurelius"], ["If it is not right, do not do it; if it is not true, do not say it.", "Marcus Aurelius"], ["Very little is needed to make a happy life; it is all within yourself.", "Marcus Aurelius"], ["You have power over your mind, not outside events.", "Marcus Aurelius"], ["My formula for greatness in a human being is amor fati.", "Friedrich Nietzsche"], ["He who has a why to live can bear almost any how.", "Friedrich Nietzsche"], ["Become who you are.", "Friedrich Nietzsche"], ["One must have chaos within to give birth to a dancing star.", "Friedrich Nietzsche"], ["I am a citizen of the world.", "Diogenes"], ["He has the most who is most content with the least.", "Diogenes"], ["I am looking for an honest man.", "Diogenes"], ["The unexamined life is not worth living.", "Socrates"], ["Wisdom begins in wonder.", "Socrates"], ["I know that I know nothing.", "Socrates"], ["The first and greatest victory is to conquer yourself.", "Plato"], ["The beginning is the most important part of the work.", "Plato"], ["Courage is knowing what not to fear.", "Plato"], ["Excellence is not an act, but a habit.", "Aristotle"], ["Well begun is half done.", "Aristotle"], ["It is the mark of an educated mind to entertain a thought without accepting it.", "Aristotle"], ["We suffer more often in imagination than in reality.", "Seneca"], ["No man is free who is not master of himself.", "Epictetus"]];
function quote(){const n=new Date(),k=Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5),q=QUOTES[k%QUOTES.length];
 return `<p class="epi">“${esc(q[0])}”<br><b style="font-style:normal;font-size:12.5px">— ${esc(q[1])}</b></p>`}
function vHome(){const te=S.entries.find(e=>e.date===today());
 view(`<div class="home">${quote()}<button class="btn" data-a="write">✎ ${te?"Continue today’s entry":"Write today’s entry"}</button></div>`)}

function vDiary(){view(`<div class="sp"><h1 style="margin:0;font-size:26px">My Journal</h1><button class="btn" data-a="write">✎ Write today</button></div><div class="mu sm" style="margin-top:6px">${S.entries.length} entries · ${S.entries.reduce((n,e)=>n+e.photos.length,0)} photographs</div><input id="q" class="mt" placeholder="Search titles, text, #tags, dates…" value="${esc(q)}"><div id="tl2"></div>`,()=>{paintD();
 $("#q").addEventListener("input",e=>{q=e.target.value;paintD()})})}
function paintD(){const k=q.trim().toLowerCase();let L=S.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt-a.createdAt);
 if(k)L=L.filter(e=>((e.title||"")+" "+(e.body||"")+" "+e.date).toLowerCase().includes(k));
 let last="",o="";L.forEach(e=>{const d=fd(e.date),m=MO[d.getMonth()]+" "+d.getFullYear();if(m!==last){o+=`<div class="serif mu mt"><i>${m}</i></div>`;last=m}o+=eItem(e)});
 $("#tl2").innerHTML=o||`<div class="card mt mu">Nothing yet. <a href="#/edit/new/${today()}" style="text-decoration:underline">Write something</a>.</div>`}

function vEntry(id){const e=eById(id);if(!e){location.hash="#/diary";return}
 const ch=(e.streakIds||[]).map(sById).filter(Boolean).map(s=>`<span class="chip" style="color:${COL[s.color]};border-color:${COL[s.color]}">${esc(s.name)}</span>`).join(" ");
 view(`<a href="#/diary" class="mu sm">← Journal</a>
 <div class="sp mt"><h1 style="margin:0;font-size:27px">${esc(e.title)||'<span class="mu">Untitled</span>'}</h1><span class="row"><button class="btn g s" data-a="edit" data-id="${id}">Edit</button><button class="btn d s" data-a="delE" data-id="${id}">Delete</button></span></div>
 <div class="mu serif"><i>${fl(e.date)}</i></div>${ch?`<div class="row mt">${ch}</div>`:""}
 <div class="prose mt">${e.body?md(e.body):'<i class="mu">Photographs only.</i>'}</div>

function vEdit(mode,a,b){let e=mode==="id"?eById(a):null;if(mode==="id"&&!e){location.hash="#/diary";return}
 ED={id:e?e.id:null,date:e?e.date:(/^\d{4}-/.test(a||"")?a:today()),title:e?e.title:"",body:e?e.body:"",streakIds:new Set(e?e.streakIds||[]:b?[b]:[]),photos:e?e.photos.map(p=>({...p})):[],createdAt:e?e.createdAt:Date.now(),dirty:false};
 const cand=S.streaks.filter(s=>s.status==="active");
 view(`<a href="#/${ED.id?"entry/"+ED.id:"diary"}" class="mu sm" data-a="back">← Cancel</a>
 <h1 style="margin:6px 0 12px;font-size:24px">${e?"Edit":"New"} entry</h1>
 <div class="grid" style="grid-template-columns:1fr auto"><input id="et" placeholder="Title (optional)" value="${esc(ED.title)}" class="serif"><input id="ed" type="date" value="${ED.date}" style="width:auto"></div>
 <textarea id="eb" class="mt" placeholder="Write freely… (**bold**, *italic*, #tags)">${esc(ED.body)}</textarea>
 ${cand.length?`<div class="mu sm mt">Count this entry towards:</div><div class="row mt">${cand.map(s=>`<button class="pk ${ED.streakIds.has(s.id)?"on":""}" style="--c:${COL[s.color]}" data-a="pick" data-id="${s.id}">${esc(s.name)}</button>`).join("")}</div>`:""}
 <div class="sp" style="margin-top:20px"><h3 style="margin:0">Photographs</h3><span class="mu sm">kept on this device</span></div>
 <div class="ph mt" id="eph"></div>
 <div class="row" style="margin-top:20px"><button class="btn" data-a="save">Save entry</button></div>`,()=>{phs();
 $("#et").oninput=x=>{ED.title=x.target.value;ED.dirty=1};$("#eb").oninput=x=>{ED.body=x.target.value;ED.dirty=1};$("#ed").onchange=x=>{ED.date=x.target.value||today();ED.dirty=1}})}
function phs(){$("#eph").innerHTML=ED.photos.map(p=>`<figure><img src="${p.src}"><button class="x" data-a="rmp" data-id="${p.id}">✕</button><input data-cap="${p.id}" placeholder="Caption…" value="${esc(p.cap||"")}"></figure>`).join("")+`<button class="add" data-a="addp">＋ Add photos</button>`}
function shrink(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const m=1800,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.85))};i.onerror=()=>ok(r.result);i.src=r.result};r.readAsDataURL(f)})}
async function saveE(){if(!ED.title.trim()&&!ED.body.trim()&&!ED.photos.length){toast("Nothing to save yet");return}
 const r={id:ED.id||uid(),date:ED.date,title:ED.title.trim(),body:ED.body,streakIds:[...ED.streakIds],photos:ED.photos,createdAt:ED.createdAt,updatedAt:Date.now()};
 try{await DB.put("entries",r)}catch(x){toast("Couldn’t save — storage may be full");return}
 const i=S.entries.findIndex(x=>x.id===r.id);i>=0?S.entries[i]=r:S.entries.push(r);ED.dirty=false;await autoDone();toast("Saved ✦");
 const dn=r.streakIds.map(sById).filter(s=>s&&dstat(s,r.date)==="c");if(dn.length)setTimeout(()=>toast("✅ Day complete: "+dn.map(s=>s.name).join(", ")),800);
 location.hash="#/entry/"+r.id}

function vStreaks(){const G=[["active","Active"],["paused","Paused"],["done","Completed"],["ended","Ended"]];
 view(`<div class="sp"><h1 style="margin:0;font-size:26px">Streaks</h1><button class="btn" data-a="newS">＋ New</button></div>
 ${S.streaks.some(s=>s.status==="active")?`<div class="card mt row" style="gap:18px"><span>${S.entries.some(e=>e.date===today()&&(e.title||e.body||"").trim())?"✅":"⬜"} Writing today</span><span>${S.entries.some(e=>e.date===today()&&e.photos.length)?"✅":"⬜"} Photograph today</span></div>`:""}
 ${G.map(([k,l])=>{const L=S.streaks.filter(s=>s.status===k);return L.length?`<h2 class="serif mu" style="font-size:15px;margin:22px 0 0"><i>${l}</i></h2><div class="grid mt">${L.map(sCard).join("")}</div>`:""}).join("")}
 ${S.streaks.length?"":`<div class="card mt mu">A streak is a promise: write and add one photo, every day, for N days. Run several at once — each is independent.</div>`}`)}
function sForm(){modal(`<h3 style="margin:0 0 10px">New streak</h3><input id="sn" placeholder="Name, e.g. 100 Days of Light">
 <div class="grid mt" style="grid-template-columns:1fr 1fr"><div><label class="sm mu">Days</label><input id="sd" type="number" min="1" value="30"></div><div><label class="sm mu">Start</label><input id="ss" type="date" value="${today()}"></div></div>
 <div class="row mt" id="sw">${Object.entries(COL).map(([k,c],i)=>`<button class="sw ${i?"":"on"}" data-a="sw" data-c="${k}" style="background:${c}"></button>`).join("")}</div>
 <div class="mu sm mt">A day counts when an entry linked to this streak has writing and at least one photo.</div>
 <div class="row mt"><button class="btn" data-a="saveS">Create</button><button class="btn g" data-a="x">Cancel</button></div>`);$("#modal").dataset.c="red"}
function vStreak(id){const s=sById(id);if(!s){location.hash="#/streaks";return}const x=stats(s),c=COL[s.color],t=today();
 view(`<a href="#/streaks" class="mu sm">← Streaks</a>
 <div class="card mt" style="border-top:4px solid ${c}"><div class="sp"><h1 style="margin:0;font-size:25px">${esc(s.name)}</h1><span class="chip">${s.status}</span></div>
 <div class="bar mt"><i style="width:${x.pct}%;background:${c}"></i></div>
 <div class="grid mt" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr))"><div class="stat"><b>${x.run}</b><span class="mu sm">day run ${FLAME}</span></div><div class="stat"><b>${x.done}/${s.duration}</b><span class="mu sm">done</span></div><div class="stat"><b>${x.miss}</b><span class="mu sm">missed</span></div></div>
 <div class="mu sm mt">${fs(s.start)} → ${fs(x.last)}</div></div>
 <div class="row mt"><button class="btn" data-a="new" data-id="${s.id}">✎ ${dstat(s,t)==="c"?"Write another":"Complete today"}</button>
 ${s.status==="active"?`<button class="btn g" data-a="endS" data-id="${s.id}">End</button>`:""}<button class="btn d" data-a="delS" data-id="${s.id}">Delete</button></div>
 <h2 style="font-size:20px;margin-top:22px">Progress</h2><div class="card mt" style="--c:${c}"><div class="dg">${x.days.map((d,i)=>{const z=dstat(s,d);return `<button class="day ${d>t?"f":z==="c"?"c":z==="p"?"p":d<t?"m":""} ${d===t?"t":""}" data-a="day" data-date="${d}" title="${d}">${i+1}</button>`}).join("")}</div>
 <div class="mu sm mt">Filled = complete · dashed = partial · struck = missed</div></div>`)}

function vCal(){const y=calM.getFullYear(),m=calM.getMonth(),dim=new Date(y,m+1,0).getDate(),t=today();let c="";
 for(let i=0;i<new Date(y,m,1).getDay();i++)c+="<div></div>";
 for(let d=1;d<=dim;d++){const k=`${y}-${p2(m+1)}-${p2(d)}`,L=S.entries.filter(e=>e.date===k),dots=[...new Set(L.flatMap(e=>e.streakIds||[]))].map(sById).filter(Boolean).map(s=>`<span class="dot" style="background:${COL[s.color]}"></span>`).join("");
  c+=`<button class="cell ${L.length?"h":""} ${k===t?"t":""}" data-a="calday" data-date="${k}">${d}${L.length?`<span>${dots||'<span class="dot" style="background:var(--mu)"></span>'}</span>`:""}</button>`}
 view(`<h1 style="margin:0 0 12px;font-size:26px">Calendar</h1><div class="card"><div class="sp"><b class="serif" style="font-size:18px">${MO[m]} ${y}</b><span class="row"><button class="btn g s" data-a="cp">‹</button><button class="btn g s" data-a="cn">›</button></span></div>
 <div class="cg mu sm mt">${"SMTWTFS".split("").map(x=>`<div>${x}</div>`).join("")}</div><div class="cg" style="margin-top:4px">${c}</div></div><div class="mu sm mt">Tap a day to see or add what you recorded.</div>`)}
function dayModal(d,sid){const L=S.entries.filter(e=>e.date===d&&(!sid||(e.streakIds||[]).includes(sid)));
 modal(`<div class="sp"><h3 style="margin:0">${fl(d)}</h3><button class="btn g s" data-a="x">✕</button></div>${L.map(eItem).join("")||'<div class="mu mt">Nothing recorded this day.</div>'}
 <div class="mt"><button class="btn" data-a="new" data-date="${d}" ${sid?`data-id="${sid}"`:""}>✎ Write for this day</button></div>`)}

function vSet(){const T=S.set.theme||document.documentElement.dataset.theme;
 view(`<h1 style="margin:0;font-size:26px">Settings</h1>
 <h2 style="font-size:18px;margin-top:20px">Privacy</h2><div class="card"><div class="set"><div><b class="sm">PIN lock</b><div class="mu sm">${S.set.pin?"PIN is on":"Keep your journal private"}</div></div><span class="row"><button class="btn g s" data-a="setPin">${S.set.pin?"Change":"Set PIN"}</button>${S.set.pin?`<button class="btn d s" data-a="clearPin">Remove</button>`:""}</span></div></div>
 <h2 style="font-size:18px;margin-top:20px">Theme</h2><div class="card"><div class="row">${Object.entries(COL).map(([k,c])=>`<button class="sw ${T===k?"on":""}" data-a="theme" data-t="${k}" style="background:${c}"></button>`).join("")}</div></div>
 <h2 style="font-size:18px;margin-top:20px">Backup & restore</h2><div class="card"><div class="mu sm">Last backup: ${S.set.lastBackup?new Date(S.set.lastBackup).toLocaleString():"never"}</div>
 <div class="row mt"><button class="btn" data-a="exp">⬇ Export backup</button><button class="btn g" data-a="imp">⬆ Restore</button></div>
 <div class="mu sm mt">Your journal lives on this phone. Save a copy now and then to keep it safe.</div></div>
 <h2 style="font-size:18px;margin-top:20px;color:var(--dg)">Danger zone</h2><div class="card"><div class="sp"><span class="sm">Erase all entries, photos and streaks</span><button class="btn d s" data-a="wipe">Erase</button></div></div>
 <div class="mu sm mt" style="text-align:center"><i>Amor Fati · love of fate</i></div>`)}

/* ---- backup ---- */
async function exp(){const bk={app:"keepsake",version:2,exportedAt:new Date().toISOString(),streaks:S.streaks,entries:S.entries};
 const f=new File([JSON.stringify(bk)],`amorfati-backup-${today()}.json`,{type:"application/json"});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]})}else{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}}
 catch(e){if(e&&e.name==="AbortError")return;toast("Couldn’t save the backup file here");return}
 S.set.lastBackup=Date.now();await saveSet();toast("Backup exported ✦");render()}
$("#bin").onchange=async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;let b;
 try{b=JSON.parse(await f.text())}catch(_){toast("Not a valid backup");return}
 if(b.app!=="keepsake"||!Array.isArray(b.entries)||!Array.isArray(b.streaks)){toast("Backup failed validation");return}
 let n=0;for(const s of b.streaks)if(!sById(s.id)){await DB.put("streaks",s)}
 for(const e of b.entries)if(!eById(e.id)){e.photos=(e.photos||[]).map(p=>({id:p.id,cap:p.cap||p.caption||"",src:p.src||(p.data?`data:${p.type||"image/jpeg"};base64,${p.data}`:"")}));await DB.put("entries",e);n++}
 await load();toast(`Restored ${n} new entries ✦`);render()};

/* ---- events ---- */
document.addEventListener("click",async ev=>{const el=ev.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id,go=h=>{closeM();location.hash=h};
 switch(a){
 case"x":closeM();break;
 case"write":{const e=S.entries.find(x=>x.date===today());go(e?"#/edit/id/"+e.id:"#/edit/new/"+today());break}
 case"new":go(`#/edit/new/${el.dataset.date||today()}${id?"/"+id:""}`);break;
 case"entry":go("#/entry/"+id);break;case"edit":go("#/edit/id/"+id);break;case"streak":go("#/streak/"+id);break;
 case"back":if(ED&&ED.dirty&&!confirm("Discard unsaved changes?"))ev.preventDefault();else ED=null;break;
 case"pick":ED.streakIds.has(id)?ED.streakIds.delete(id):ED.streakIds.add(id);ED.dirty=1;el.classList.toggle("on");break;
 case"addp":$("#pin").click();break;case"rmp":ED.photos=ED.photos.filter(p=>p.id!==id);ED.dirty=1;phs();break;
 case"save":saveE();break;
 case"delE":modal(`<h3 style="margin:0 0 8px">Delete this entry?</h3><p class="mu sm">Its writing and photos are removed permanently.</p><div class="row"><button class="btn d" data-a="delE2" data-id="${id}">Delete</button><button class="btn g" data-a="x">Cancel</button></div>`);break;
 case"delE2":await DB.del("entries",id);S.entries=S.entries.filter(e=>e.id!==id);closeM();toast("Deleted");location.hash="#/diary";break;
 case"newS":sForm();break;
 case"sw":document.querySelectorAll("#sw .sw").forEach(x=>x.classList.remove("on"));el.classList.add("on");$("#modal").dataset.c=el.dataset.c;break;
 case"saveS":{const n=$("#sn").value.trim(),d=parseInt($("#sd").value,10),st=$("#ss").value;if(!n){toast("Name your streak");return}if(!(d>=1)){toast("Days must be 1 or more");return}if(!st){toast("Pick a start date");return}
  await DB.put("streaks",{id:uid(),name:n,duration:d,start:st,color:$("#modal").dataset.c||"red",status:"active",createdAt:Date.now()});await load();closeM();toast("Streak created ✦");render();break}
 case"endS":await (async()=>{const s=sById(id);s.status="ended";await DB.put("streaks",s);toast("Streak ended — memories kept");render()})();break;
 case"delS":modal(`<h3 style="margin:0 0 8px">Delete “${esc((sById(id)||{}).name)}”?</h3><p class="mu sm">Entries and photos stay; they just lose this link.</p><div class="row"><button class="btn d" data-a="delS2" data-id="${id}">Delete</button><button class="btn g" data-a="x">Cancel</button></div>`);break;
 case"delS2":for(const e of S.entries)if((e.streakIds||[]).includes(id)){e.streakIds=e.streakIds.filter(z=>z!==id);await DB.put("entries",e)}
  await DB.del("streaks",id);S.streaks=S.streaks.filter(s=>s.id!==id);closeM();toast("Streak deleted");location.hash="#/streaks";break;
 case"day":dayModal(el.dataset.date,id);break;case"calday":dayModal(el.dataset.date);break;
 case"cp":calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);vCal();break;case"cn":calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);vCal();break;
 case"theme":S.set.theme=el.dataset.t;await saveSet();theme();vSet();break;
 case"setPin":{const p=prompt("Choose a 4-digit PIN:");if(p&&/^\d{4}$/.test(p)){S.set.pin=await hashPin(p);await saveSet();toast("PIN set");vSet()}else if(p)toast("PIN must be 4 digits");break}
 case"clearPin":S.set.pin=null;await saveSet();toast("PIN removed");vSet();break;
 case"exp":exp();break;case"imp":$("#bin").click();break;
 case"persist":try{toast(await navigator.storage.persist()?"Data protected from auto-cleanup":"Browser declined — export backups regularly")}catch(_){toast("Not supported here")}break;
 case"wipe":modal(`<h3 style="margin:0 0 8px;color:var(--dg)">Erase everything?</h3><p class="sm">Type <b>DELETE</b> to confirm.</p><input id="wc"><div class="row mt"><button class="btn d" data-a="wipe2">Erase</button><button class="btn g" data-a="x">Cancel</button></div>`);break;
 case"wipe2":if($("#wc").value!=="DELETE"){toast("Type DELETE to confirm");return}await DB.clear("entries");await DB.clear("streaks");await load();closeM();toast("All data erased");location.hash="#/home";render();break}});
document.addEventListener("input",e=>{const c=e.target.dataset.cap;if(c&&ED){const p=ED.photos.find(x=>x.id===c);if(p){p.cap=e.target.value;ED.dirty=1}}});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});
$("#pin").onchange=async ev=>{const fs2=[...ev.target.files];ev.target.value="";if(!ED||!fs2.length)return;toast("Adding photos…");
 for(const f of fs2)ED.photos.push({id:uid(),cap:"",src:await shrink(f)});ED.dirty=1;phs();toast("Photos added ✦")};
addEventListener("beforeunload",e=>{if(ED&&ED.dirty){e.preventDefault();e.returnValue=""}});
function net(){const o=navigator.onLine;$("#net").innerHTML=`<span class="dot" style="background:${o?"#34c379":"#e5484d"}"></span> ${o?"online":"offline"}`}
addEventListener("online",net);addEventListener("offline",net);
new MutationObserver(net).observe($("#app"),{childList:true});net();
let tc=today();setInterval(()=>{if(tc!==today()){tc=today();render()}},30000);

async function hashPin(p){try{const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("amorfati:"+p));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(_){return "x"+btoa("amorfati:"+p)}}
let pb="",hiddenAt=0,started=false;
function showLock(){$("#lock").hidden=false;pb="";$("#lockMsg").textContent="Enter your PIN";$("#lockPad").innerHTML=[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<div></div>":`<button data-k="${k}">${k}</button>`).join("");dots()}
function dots(){$("#lockDots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<pb.length?"f":""}"></i>`).join("")}
$("#lockPad").addEventListener("click",ev=>{const b=ev.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;if(k==="⌫")pb=pb.slice(0,-1);else if(pb.length<4)pb+=k;dots();
 if(pb.length===4)setTimeout(async()=>{if(await hashPin(pb)===S.set.pin){$("#lock").hidden=true;pb="";if(!started)start()}else{$("#lockMsg").textContent="Wrong PIN";pb="";dots();setTimeout(()=>$("#lockMsg").textContent="Enter your PIN",1200)}},120)});
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(S.set.pin&&hiddenAt&&Date.now()-hiddenAt>60000&&$("#lock").hidden)showLock()});
async function start(){started=true;await autoDone();render()}
(async()=>{try{await DB.open();await load()}catch(e){$("#app").innerHTML=`<div class="card">Storage failed to open: ${esc(e.message||e)}</div>`;return}
 theme();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
 if(!("pin" in S.set)){S.set.pin=await hashPin("6592");await saveSet()}
 if(S.set.pin)showLock();else start()})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
