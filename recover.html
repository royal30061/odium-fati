<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find my journal</title>
<style>body{font:16px/1.6 system-ui,sans-serif;background:#170b0a;color:#f7e9e4;max-width:520px;margin:0 auto;padding:24px 16px}
h1{font:600 24px Georgia,serif}button{padding:12px 16px;margin:6px 6px 6px 0;border:0;border-radius:11px;font:600 15px system-ui;background:#ff5d55;color:#2a0b08}
button.g{background:none;border:1px solid #3c231e;color:#f7e9e4}.c{margin-top:14px;padding:14px;border-radius:12px;background:#231412;border:1px solid #3c231e}.m{color:#b3938a;font-size:13px}</style></head>
<body><h1>✦ Find my journal</h1>
<p class="m">This only reads what is already saved on this phone for this website. Nothing is deleted or sent anywhere.</p>
<button id="scan">Scan this phone</button><div id="out"></div>
<script>
const out=document.getElementById("out"),found={};
const open1=(n,v)=>new Promise((ok,no)=>{const r=v?indexedDB.open(n,v):indexedDB.open(n);
 r.onupgradeneeded=e=>{if(!v)return;const d=e.target.result;["entries","streaks","projects"].forEach(s=>d.objectStoreNames.contains(s)||d.createObjectStore(s,{keyPath:"id"}));d.objectStoreNames.contains("meta")||d.createObjectStore("meta",{keyPath:"key"})};
 r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const all=(db,s)=>new Promise(ok=>{if(!db.objectStoreNames.contains(s))return ok([]);const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>ok([])});
const b64=buf=>{const b=new Uint8Array(buf);let s="";for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s)};
const fixPhotos=e=>({...e,photos:(e.photos||[]).map(p=>p.src?p:{id:p.id,caption:p.caption||"",src:p.data?`data:${p.type||"image/jpeg"};base64,${b64(p.data)}`:""})});
document.getElementById("scan").onclick=async()=>{
 out.innerHTML="";let dbs;
 try{dbs=await indexedDB.databases()}catch(e){out.innerHTML='<div class="c">This browser cannot list saved data. Try Chrome.</div>';return}
 if(!dbs.length){out.innerHTML='<div class="c"><b>Nothing is saved for this website on this browser.</b><br>The data is not here. If you use the installed app, also run this scan from inside it, and check your Downloads folder for any backup file.</div>';return}
 for(const d of dbs){let db;try{db=await open1(d.name)}catch(e){continue}
  const entries=(await all(db,"entries")).map(fixPhotos),streaks=await all(db,"streaks"),projects=await all(db,"projects"),meta=await all(db,"meta");
  const photos=entries.reduce((n,e)=>n+e.photos.length,0);db.close();found[d.name]={entries,streaks,projects,meta};
  const dates=entries.map(e=>e.date).sort();
  out.insertAdjacentHTML("beforeend",`<div class="c"><b>${d.name}</b> <span class="m">(version ${d.version})</span><br>${entries.length} journal entries · ${photos} photos · ${streaks.length} streaks · ${projects.length} projects${dates.length?`<br><span class="m">${dates[0]} → ${dates[dates.length-1]}</span>`:""}
  ${entries.length+projects.length+streaks.length?`<br><button data-dl="${d.name}">Download a backup file</button>${d.name!=="keepsake"?`<button class="g" data-mv="${d.name}">Copy into Odium Fati</button>`:""}`:""}</div>`)}
};
out.addEventListener("click",async e=>{const dl=e.target.dataset.dl,mv=e.target.dataset.mv,n=dl||mv;if(!n)return;const d=found[n];
 if(dl){const bk={app:"keepsake",version:3,exportedAt:new Date().toISOString(),streaks:d.streaks,entries:d.entries,projects:d.projects};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(bk)],{type:"application/json"}));a.download=`journal-backup-${n}.json`;a.click();e.target.textContent="Saved to Downloads ✓"}
 if(mv){const db=await open1("keepsake",3);let c=0;
  for(const s of["entries","streaks","projects"]){const have=new Set((await all(db,s)).map(x=>x.id));
   await new Promise(ok=>{const t=db.transaction(s,"readwrite"),st=t.objectStore(s);for(const x of d[s])if(!have.has(x.id)){st.put(x);c++}t.oncomplete=ok})}
  db.close();e.target.textContent=`Copied ${c} records ✓ — open Odium Fati`}});
</script></body></html>
